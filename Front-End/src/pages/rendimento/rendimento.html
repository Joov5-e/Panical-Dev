<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="rendimento-layout.css" />
    <link rel="stylesheet" href="rendimento.css" />
    <link rel="stylesheet" href="../../styles/layout/responsive.css" />

    <title>Rendimento | PaniCale</title>
  </head>

  <body>
    <button
      id="btn-menu"
      type="button"
      aria-label="Abrir navegação"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span>☰</span>
    </button>

    <div class="coluna_lateral oculta">
      <ul>
        <li>
          <a href="../cadastro-receitas/cadastro-receitas.html">
            <img src="../../assets/icons/navigation/receita.svg" alt="" />
          </a>
        </li>
        <li>
          <a href="../ficha-tecnica/ficha-tecnica.html">
            <img
              src="../../assets/icons/navigation/formulacao-da-massa.svg"
              alt=""
            />
          </a>
        </li>
        <li>
          <a href="../precificacao/precificacao.html">
            <img
              src="../../assets/icons/navigation/precificacao.svg"
              alt=""
            />
          </a>
        </li>
        <li>
          <a href="../catalogo/catalogo.html">
            <img src="../../assets/icons/navigation/catalogo.svg" alt="" />
          </a>
        </li>
      </ul>

      <section class="menu-sair menu-sair-coluna">
        <hr />
        <a href="../../../../index.html">
          <img src="../../assets/icons/navigation/sair.svg" alt="" />
        </a>
      </section>
    </div>

    <header
      class="Dash_lateral"
      id="sidebar"
      aria-label="Navegação principal"
      aria-hidden="true"
      inert
    >
      <article class="logo">
        <img src="../../assets/images/logo-pan.png" alt="Logo-Pan" />
        <p>PaniCale</p>
      </article>

      <hr class="linha-divisora" />

      <nav class="Dash_menu">
        <ul>
          <li>
            <a href="../cadastro-receitas/cadastro-receitas.html">
              <img src="../../assets/icons/navigation/receita.svg" alt="" />
              <span>Receita</span>
            </a>
          </li>
          <li>
            <a href="../ficha-tecnica/ficha-tecnica.html">
              <img
                src="../../assets/icons/navigation/formulacao-da-massa.svg"
                alt=""
              />
              <span>Ficha Técnica</span>
            </a>
          </li>
          <li>
            <a href="../precificacao/precificacao.html">
              <img
                src="../../assets/icons/navigation/precificacao.svg"
                alt=""
              />
              <span>Precificação</span>
            </a>
          </li>
          <li>
            <a href="../catalogo/catalogo.html">
              <img
                src="../../assets/icons/navigation/catalogo.svg"
                alt=""
              />
              <span>Catálogo</span>
            </a>
          </li>
        </ul>
      </nav>

      <section class="menu-sair">
        <hr />
        <a href="../../../../index.html">
          <img src="../../assets/icons/navigation/sair.svg" alt="" />
          <span>Sair</span>
        </a>
      </section>
    </header>

    <div class="overlay-menu" id="overlay"></div>

    <main>
      <div class="rendimento-main">
        <div class="input-main-rendimento">
          <div class="input-label-rendimento">
            <label class="label-rendimento-input" for="peso-cru">
              PESO CRU DA PEÇA (g)
            </label>
            <input
              type="number"
              id="peso-cru"
              class="input-rendimento"
              placeholder="Ex: 50"
              min="1"
            />
          </div>

          <div class="input-label-rendimento">
            <label class="label-rendimento-input" for="peso-assado">
              PESO ASSADO DA PEÇA (g)
            </label>
            <input
              type="number"
              id="peso-assado"
              class="input-rendimento"
              placeholder="Ex: 40"
              min="1"
            />
          </div>

          <div class="input-label-rendimento">
            <label class="label-rendimento-input" for="peso-assamento">
              PESO POR ASSAMENTO (%)
            </label>
            <input
              type="number"
              id="peso-assamento"
              class="input-rendimento"
              placeholder="Ex: 10"
              min="0"
              max="100"
            />
          </div>
        </div>

        <div class="section-main">
          <section class="section-rendimento">
            <h1>Quantidade de Peças</h1>

            <div class="qnt-pecas">
              <img
                class="img-pao"
                src="../../assets/images/pao-rendimento.png"
                alt="Imagem de pão"
              />
              <h1 class="text-rendimento">132</h1>
              <p>UNIDADES</p>
            </div>
          </section>

          <section class="section-rendimento">
            <h1>Peso Assado Total</h1>

            <div class="peso-total">
              <img
                class="img-balanca"
                src="../../assets/images/balança-rendimento.png"
                alt="Imagem de balança"
              />
              <h1 class="text-rendimento">14</h1>
              <p id="mdd" class="mdd">kg</p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="rendimento.js" defer></script>
    <script src="../../scripts/layout/navigation.js" defer></script>
  </body>
</html>
