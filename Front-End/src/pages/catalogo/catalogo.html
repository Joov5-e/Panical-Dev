<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo</title>
    <link rel="stylesheet" href="../../styles/layout/dashboard.css" />
    <link rel="stylesheet" href="catalogo.css" />
  </head>
  <body>
    <button
      id="btn-menu"
      type="button"
      aria-label="Abrir navegação"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span aria-hidden="true">☰</span>
    </button>
    <div class="coluna_lateral">
      <ul>
        <li>
          <a href="../cadastro-receitas/cadastro-receitas.html" aria-label="Receita">
            <img src="../../assets/icons/navigation/receita.svg" alt="" />
          </a>
        </li>
        <li>
          <a href="../ficha-tecnica/ficha-tecnica.html" aria-label="Ficha Técnica">
            <img src="../../assets/icons/navigation/formulacao-da-massa.svg" alt="" />
          </a>
        </li>
        <li>
          <a href="../precificacao/precificacao.html" aria-label="Precificação">
            <img src="../../assets/icons/navigation/precificacao.svg" alt="" />
          </a>
        </li>
        <li>
          <a href="catalogo.html" aria-label="Catálogo" aria-current="page">
            <img src="../../assets/icons/navigation/catalogo.svg" alt="" />
          </a>
        </li>
      </ul>

      <section class="menu-sair menu-sair-coluna">
        <hr />
        <a href="../../../../index.html">
          <img src="../../assets/icons/navigation/sair.svg" alt="" />
        </a>
      </section>
    </div>

    <header
      class="Dash_lateral"
      id="sidebar"
      aria-label="Navegação principal"
      aria-hidden="true"
      inert
    >
      <article class="logo">
        <img src="../../assets/images/logo-pan.png" alt="Logo-Pan" />
        <p>PaniCale</p>
      </article>
      <hr class="linha-divisora" />

      <nav class="Dash_menu" aria-label="Navegação principal">
        <ul>
          <li>
            <a href="../cadastro-receitas/cadastro-receitas.html">
              <img src="../../assets/icons/navigation/receita.svg" alt="" />
              <span>Receita</span>
            </a>
          </li>
          <li>
            <a href="../ficha-tecnica/ficha-tecnica.html">
              <img src="../../assets/icons/navigation/formulacao-da-massa.svg" alt="" />
              <span>Ficha Técnica</span>
            </a>
          </li>
          <li>
            <a href="../precificacao/precificacao.html">
              <img src="../../assets/icons/navigation/precificacao.svg" alt="" />
              <span>Precificação</span>
            </a>
          </li>
          <li>
            <a href="catalogo.html" aria-current="page">
              <img src="../../assets/icons/navigation/catalogo.svg" alt="" />
              <span>Catálogo</span>
            </a>
          </li>
        </ul>
      </nav>

      <section class="menu-sair">
        <hr />
        <a href="../../../../index.html">
          <img src="../../assets/icons/navigation/sair.svg" alt="" />
          <span>Sair</span>
        </a>
      </section>
    </header>

    <main>
      <section class="catalogo" aria-labelledby="catalogo-titulo">
        <div class="catalogo-cabecalho">
          <h1 id="catalogo-titulo">Catálogo de receitas</h1>
          <span class="catalogo-linha-titulo"></span>
          <label class="sr-only" for="filtro-categoria">Filtrar receitas</label>
          <select id="filtro-categoria">
            <option value="mais-recente">Mais Recentes</option>
            <option value="favoritas">Favoritas</option>
            <option value="massa-salgado">Massa Salgado</option>
            <option value="massa-integral">Massa Integral</option>
            <option value="massa-meio-doce">Massa Semi Doce</option>
            <option value="massa-doce">Massa Doce</option>
          </select>
        </div>

        <div class="catalogo-categoria">
          <p id="categoria-titulo">Mais Recentes:</p>
          <span class="catalogo-linha-titulo"></span>
        </div>

        <section class="lista-receitas">
          <p class="catalogo-vazio" role="status">Suas receitas salvas aparecerão aqui.</p>
        </section>
      </section>
    </main>

    <button
      class="botao-apagar-receitas"
      id="apagar-receitas"
      type="button"
      disabled
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3" />
      </svg>
      <span>Apagar receitas</span>
    </button>

    <dialog
      class="modal-receita"
      id="modal-receita"
      aria-labelledby="modal-receita-titulo"
    >
      <button
        class="modal-receita-fechar"
        type="button"
        aria-label="Fechar receita"
      >
        ×
      </button>
      <div class="modal-receita-conteudo">
        <h2 id="modal-receita-titulo"></h2>
        <p id="modal-receita-descricao"></p>
        <dl class="modal-receita-detalhes">
          <div>
            <dt>Porção de farinha de trigo</dt>
            <dd id="modal-receita-farinha"></dd>
          </div>
          <div>
            <dt>Categoria</dt>
            <dd id="modal-receita-categoria"></dd>
          </div>
        </dl>
        <div class="modal-receita-secao">
          <h3>Ingredientes</h3>
          <ul id="modal-receita-ingredientes"></ul>
        </div>
        <div class="modal-receita-secao">
          <h3>Modo de preparo</h3>
          <p id="modal-receita-preparo"></p>
        </div>
        <dl class="modal-receita-detalhes">
          <div>
            <dt>Rendimento</dt>
            <dd id="modal-receita-rendimento"></dd>
          </div>
          <div>
            <dt>Custo total</dt>
            <dd id="modal-receita-custo"></dd>
          </div>
          <div>
            <dt>Peso por unidade</dt>
            <dd id="modal-receita-peso"></dd>
          </div>
          <div>
            <dt>Tempo de preparo</dt>
            <dd id="modal-receita-tempo"></dd>
          </div>
        </dl>
      </div>
    </dialog>

    <div class="overlay-menu" id="overlay"></div>
    <script src="catalogo.js"></script>
    <script src="../../scripts/layout/navigation.js"></script>
  </body>
</html>
